[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "positive-judge"
version = "0.1.0"
description = "形態素解析と日本語評価極性辞書による、日本語のポジティブ/ネガティブ判定"
readme = "README.md"
requires-python = ">=3.9"
# janome は純Pythonの形態素解析器(辞書同梱)。pip install 時に自動で入る
dependencies = ["janome"]

[project.scripts]
positive-judge = "positive_judge:main"

[tool.setuptools]
py-modules = ["positive_judge"]
